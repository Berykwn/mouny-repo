name: CI

# Every push and pull request: lint, unit tests, a production build, and a smoke test
# that opens the build in headless Chrome and fails if the app doesn't render.
on:
  push:
    branches: [production, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # The real keys aren't needed: the smoke test only checks that the app mounts,
      # and with no saved session it never calls Supabase.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key

      - name: Smoke test
        run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
